services:
  db:
    image: postgres:16-alpine
    container_name: daily-money-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dailymoney
      POSTGRES_PASSWORD: dailymoney
      POSTGRES_DB: dailymoney
    ports:
      - "5433:5432"
    volumes:
      - dm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailymoney"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dm_pgdata:
