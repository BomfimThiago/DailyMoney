# Daily Money on the Hetzner box, isolated from Raíces: own project, own Postgres.
# Only the API and the web app join Raíces' network (raices_default) so Raíces' Caddy
# can reach them; this stack publishes no ports.
#
#   infra/deploy.sh   (from the Mac)

name: dailymoney

services:
  api:
    build:
      context: ../backend
    image: dailymoney-api
    container_name: dailymoney-api
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://dailymoney:${POSTGRES_PASSWORD}@db:5432/dailymoney
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - default
      - edge

  web:
    build:
      context: ../app
    image: dailymoney-web
    container_name: dailymoney-web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
    networks:
      - edge

  db:
    image: postgres:16-alpine
    container_name: dailymoney-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dailymoney
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dailymoney
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailymoney -d dailymoney"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - default

volumes:
  pgdata:

networks:
  edge:
    name: raices_default
    external: true
