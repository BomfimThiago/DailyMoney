name: app

on:
  push:
    branches: [main, claude/project-thread-78a6tm]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx expo export --platform web --output-dir dist
      - name: UI check (web)
        run: |
          npm install -g playwright@1.63.0
          playwright install --with-deps chromium
          DIST=dist OUT=ui-check npm run check:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check-web
          path: app/ui-check

  api-types:
    # The app's API types are generated from the backend; fail if they are out of date.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: cd backend && uv sync --frozen
      - run: cd app && npm ci && npm run api:types
      - name: Types match the API
        run: |
          git diff --exit-code app/openapi.json app/src/lib/api.gen.ts \
            || { echo "Rode 'npm run api:types' no app e faça commit do resultado."; exit 1; }
